<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mikroökonómia 100 kérdés</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f4f5;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.w{max-width:720px;margin:auto;padding:10px 10px 60px}.h{position:sticky;top:0;background:#f4f4f5f2;backdrop-filter:blur(10px);z-index:5;padding:8px 0}h1{font-size:20px;margin:0 0 8px}.m{display:flex;gap:8px;flex-wrap:wrap}.p{background:#fff;border:1px solid #ddd;border-radius:999px;padding:5px 9px;font-size:12px}.pr{height:7px;background:#ddd;border-radius:99px;overflow:hidden;margin-top:8px}#bar{height:100%;background:#f59e0b}.c{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:16px;box-shadow:0 8px 24px #0000000d}#q{font-size:19px;font-weight:800;line-height:1.35;margin:4px 0 16px}.o{width:100%;display:flex;gap:9px;text-align:left;border:2px solid #e5e7eb;background:#fff;border-radius:14px;padding:13px;margin:9px 0;font-size:16px;color:#111827}.l{display:grid;place-items:center;min-width:28px;height:28px;border-radius:8px;background:#f3f4f6;font-weight:800}.o.g{background:#f0fdf4;border-color:#86efac}.o.b{background:#fef2f2;border-color:#fca5a5}.o:disabled{opacity:1;color:#111827}#fb{display:none;padding:12px;border-radius:12px;margin-top:12px;font-size:14px}#fb.s{display:block}#fb.g{background:#f0fdf4;color:#14532d}#fb.b{background:#fef2f2;color:#7f1d1d}#next,.r{width:100%;border:0;border-radius:12px;padding:14px;margin-top:12px;background:#111827;color:#fff;font-size:16px;font-weight:800}#next:disabled{opacity:.35}#end{display:none}.big{font-size:44px;font-weight:900}.rv{padding:10px 0;border-top:1px solid #eee}@media(max-width:480px){.c{padding:14px}#q{font-size:18px}.o{font-size:15px;padding:12px}}</style></head><body><div class="w"><div class="h"><h1>Mikroökonómia – 100 kérdés</h1><div class="m"><span class="p" id="n"></span><span class="p" id="s">Pont: 0</span><span class="p" id="e">Hiba: 0</span></div><div class="pr"><div id="bar"></div></div></div><section class="c" id="quiz"><div id="q"></div><div id="a"></div><div id="fb"></div><button id="next" disabled>Következő</button></section><section class="c" id="end"><div class="big" id="fin"></div><p id="txt"></p><button class="r" onclick="location.reload()">Újrakezdés</button><h3>Hibás kérdések</h3><div id="rev"></div></section></div><script>const B=[['Mit vizsgál a közgazdaságtan?','A szűkösség melletti választásokat és döntéseket','Csak az inflációt','Csak a profitot','Csak a pénzmennyiséget'],['Mit jelent a szűkösség?','A javak korlátozott mennyiségben állnak rendelkezésre','Minden jószág ingyenes','Nincs kereslet','Nincs termelés'],['Mit jelent a hasznosság?','Szükségletkielégítő képesség','Pénzbeli ár','Termelési költség','Adóteher'],['Mit mutat a termelési lehetőségek határa?','A gazdaság maximális termelési képességét','A maximális profitot','Az egyensúlyi árat','A fogyasztó jövedelmét'],['Mi az alternatív költség?','A feladott legjobb alternatíva értéke','Az adó összege','A könyvelési költség','A piaci ár'],['Mit jelent a ceteris paribus?','Egy tényező változik, minden más változatlan','Minden tényező egyszerre változik','Semmi sem változhat','Csak az ár változhat'],['Mi a piac?','Eladók, vevők és cserekapcsolataik rendszere','Csak egy vásárcsarnok','Csak eladók','Csak vevők'],['Mit jelöl D?','Demand, kereslet','Supply, kínálat','Price, ár','Income, jövedelem'],['Mit jelöl S?','Supply, kínálat','Demand, kereslet','Price, ár','Utility, hasznosság'],['Mit mond a kereslet törvénye?','Ár nő → keresett mennyiség csökken','Ár nő → keresett mennyiség nő','Az ár nem számít','Ár csökken → kereslet csökken mindig'],['Mit mond a kínálat törvénye?','Magasabb ár mellett nő a kínált mennyiség','Magasabb ár mellett csökken a kínálat','Az ár nem számít','Magasabb ár leállítja a termelést'],['Mi a piaci egyensúly feltétele?','QD = QS','P = 0','TR = 0','QD = 0'],['Mit jelent Pe?','Egyensúlyi ár','Egyensúlyi mennyiség','Profit','Árrugalmasság'],['Mit jelent Qe?','Egyensúlyi mennyiség','Egyensúlyi ár','Jövedelem','Határhaszon'],['Mi van az egyensúlyi ár fölött?','Kínálati többlet','Hiány','Mindig egyensúly','Zéró kínálat'],['Mi van az egyensúlyi ár alatt?','Hiány / túlkereslet','Kínálati többlet','Mindig egyensúly','Zéró kereslet'],['Mikor rugalmas a kereslet?','|εp| > 1','|εp| < 1','|εp| = 0','Soha'],['Mikor rugalmatlan a kereslet?','|εp| < 1','|εp| > 1','|εp| = ∞','Mindig 2'],['Mit jelent |εp|=1?','Egységnyi rugalmasság','Teljes rugalmatlanság','Végtelen rugalmasság','Inferior jószág'],['Mi a TR képlete?','TR=P·Q','TR=P+Q','TR=P/Q','TR=Q−P'],['Mikor maximális TR a gyakorlat szerint?','|ε|=1 esetén','|ε|=0 esetén','P=0 esetén mindig','Q=0 esetén mindig'],['Ha εm>0, a jószág...','normál','inferior','független','kiegészítő'],['Ha εm<0, a jószág...','inferior','normál','luxus','helyettesítő'],['Ha εxy>0, a két termék...','helyettesítő','kiegészítő','inferior','független'],['Ha εxy<0, a két termék...','kiegészítő','helyettesítő','luxus','független'],['Mi a fogyasztás célja?','Hasznosság maximalizálása','Kiadás maximalizálása','Jövedelem nullázása','Termelő profitjának maximalizálása'],['Mit jelent MU?','Marginal Utility, határhaszon','Market Utility','Maximum Unit','Marginal Revenue'],['Mit mond Gossen I.?','Az egymást követő egységek határhaszna csökken','A határhaszon mindig nő','Az ár mindig csökken','A jövedelem mindig nő'],['Mi a költségvetési egyenes képlete?','I=Px·X+Py·Y','TR=P·Q','QD=QS','MU=TU·Q'],['Mi a költségvetési egyenes meredeksége?','−Px/Py','Px+Py','I/Px','−I/Py'],['Mi a fogyasztói optimum egyik alakja?','MUx/MUy=Px/Py','MUx+MUy=Px+Py','Px=Py mindig','MUx·Px=MUy·Py'],['QD=180−2P, QS=P−30. Pe=?','70','40','50','90'],['QD=180−2P, QS=P−30, Pe=70. Qe=?','40','70','110','10'],['QD=250−2P, QS=3P−50, P=70. Kínálati többlet=?','50','110','160','270'],['QD=220−2P, QS=P−20. Mi az egyensúly?','Pe=80, Qe=60','Pe=60, Qe=80','Pe=100, Qe=20','Pe=40, Qe=140'],['Q=120−2P, P=30. Q=?','60','30','90','120'],['m=−2, P=30, Q=60. εp=?','−1','−2','0,5','1,5'],['Mozijegy: P 2000→2400, Q 5000→4000. Ívrugalmasság kb.?','−1,22','−0,22','−2,40','+1,22'],['I=12 000, Px=1 000, Py=2 000. Max X, ha Y=0?','12','6','10','24'],['I=12 000, Px=1 000, Py=2 000. Max Y, ha X=0?','6','12','4','2'],['I=24 000, Px=2 000, Py=3 000, X=6. Y=?','4','2','6','8'],['QD=200−2P, QS=P−40. Pe=?','80','40','60','100'],['QD=200−2P, P=90. QD=?','20','90','110','40'],['QS=P−40, P=90. QS=?','50','20','90','130'],['QD=200−2P, P=50. TR=?','5000','2500','7500','10000'],['Ár +10%, keresett mennyiség −5%. εp≈?','−0,5','−2','+0,5','−5'],['Jövedelem +10%, kereslet +15%. εm=?','1,5','0,67','−1,5','0,15'],['Ha |εp|=0,54, milyen a kereslet?','Rugalmatlan','Rugalmas','Egységnyi','Végtelenül rugalmas'],['Ha adót vetnek ki az eladóra, P helyére mi kerül a kínálati függvényben?','P−t','P+t','P·t','P/t'],['QD=200−4P, QS=6P−40. Adó előtt Pe=?','24','20','40','16']];let Q=[];for(let r=0;r<2;r++)B.forEach((x,i)=>{let z=[x[2],x[3],x[4]],p=(Q.length*3)%4,c=x[1];z.splice(p,0,c);Q.push({q:(r?'Újrafogalmazva: ':'')+x[0],a:z,c:p})});const L=['A','B','C','D'];let i=0,s=0,e=0,lock=false,m=[],$=x=>document.getElementById(x);function d(){lock=false;$('next').disabled=true;$('fb').className='';$('fb').innerHTML='';let x=Q[i];$('q').textContent=(i+1)+'. '+x.q;$('a').innerHTML='';x.a.forEach((t,j)=>{let b=document.createElement('button');b.className='o';b.innerHTML='<span class="l">'+L[j]+'</span><span>'+t+'</span>';b.onclick=()=>v(j);$('a').appendChild(b)});$('n').textContent=(i+1)+' / 100';$('bar').style.width=i+'%';scrollTo(0,0)}function v(j){if(lock)return;lock=true;let x=Q[i],bs=[...document.querySelectorAll('.o')];bs.forEach(b=>b.disabled=true);bs[x.c].classList.add('g');if(j==x.c){s++;$('fb').className='s g';$('fb').innerHTML='<b>✓ Helyes.</b>'}else{e++;bs[j].classList.add('b');m.push(i);$('fb').className='s b';$('fb').innerHTML='<b>✗ Helytelen.</b> Helyes: '+L[x.c]+' – '+x.a[x.c]}$('s').textContent='Pont: '+s;$('e').textContent='Hiba: '+e;$('next').disabled=false}$('next').onclick=()=>{if(!lock)return;i++;i<100?d():f()};function f(){$('quiz').style.display='none';$('end').style.display='block';$('bar').style.width='100%';$('n').textContent='100 / 100';$('fin').textContent=s+' / 100';$('txt').textContent=s>=85?'Nagyon erős.':s>=70?'Jó eredmény. Nézd át a hibákat.':s>=50?'Az alap megvan, de még kell egy kör.':'Menj végig még egyszer.';$('rev').innerHTML=m.length?m.map(k=>{let x=Q[k];return '<div class="rv"><b>'+(k+1)+'. '+x.q+'</b><br><span style="color:#166534">Helyes: '+L[x.c]+' – '+x.a[x.c]+'</span></div>'}).join(''):'Nem volt hibás válasz. 🎯';scrollTo(0,0)}d();</script></body></html>
